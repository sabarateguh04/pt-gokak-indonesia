<!DOCTYPE html>
<html lang="id">
<head>
<script src="/js/theme.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiket — PT Gokak Indonesia</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">🏭 PT Gokak Indonesia<small>Portal Admin</small></div>
      <a href="/admin/dashboard">📍 Dashboard</a>
      <a href="/admin/teknisi">🧑‍🔧 Teknisi</a>
      <a href="/admin/tiket" class="active">🎫 Tiket</a>
      <a href="/admin/kehadiran">📆 Kehadiran</a>
      <a href="/admin/area">🗺️ Area Pabrik</a>
      <div class="logout" id="btnLogout">↩ Logout</div>
    </aside>

    <main class="main">
      <div class="main-header">
        <h1>Daftar Tiket</h1>
        <div style="display:flex;align-items:center;gap:10px">
          <button class="theme-toggle-btn" title="Ganti tema"><span class="theme-toggle-icon">🌙</span></button>
          <a class="btn" href="/admin/tiket-detail">+ Buat Tiket</a>
        </div>
      </div>

      <div class="card" style="margin-bottom:14px">
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <select id="fStatus" style="max-width:180px">
            <option value="">Semua Status</option>
            <option value="NEW">NEW</option>
            <option value="ASSIGNED">ASSIGNED</option>
            <option value="IN_PROGRESS">IN_PROGRESS</option>
            <option value="DONE">DONE</option>
            <option value="CANCELLED">CANCELLED</option>
          </select>
          <select id="fPriority" style="max-width:180px">
            <option value="">Semua Priority</option>
            <option value="LOW">LOW</option>
            <option value="MEDIUM">MEDIUM</option>
            <option value="HIGH">HIGH</option>
          </select>
        </div>
      </div>

      <div class="card">
        <table>
          <thead><tr><th>No Tiket</th><th>Judul</th><th>Area</th><th>Priority</th><th>Teknisi</th><th>Status</th><th>Jadwal</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/license-banner.js"></script>
  <script>
    Api.init('admin');
    document.getElementById('btnLogout').onclick = () => Api.logout();

    function statusBadge(v) { return `<span class="badge badge-${v}">${v}</span>`; }

    const params = new URLSearchParams(window.location.search);
    if (params.get('teknisiId')) document.title += ' (filter teknisi)';

    async function loadList() {
      const q = new URLSearchParams();
      if (document.getElementById('fStatus').value) q.set('status', document.getElementById('fStatus').value);
      if (document.getElementById('fPriority').value) q.set('priority', document.getElementById('fPriority').value);
      if (params.get('teknisiId')) q.set('teknisiId', params.get('teknisiId'));

      const res = await Api.get(`/api/tiket?${q.toString()}`);
      if (!res.success) return;
      document.getElementById('tbody').innerHTML = res.tiket.map(t => {
        const jadwal = t.tanggal_mulai
          ? `${new Date(t.tanggal_mulai).toLocaleDateString('id-ID')}${t.tanggal_selesai ? ' – ' + new Date(t.tanggal_selesai).toLocaleDateString('id-ID') : ''}`
          : '-';
        return `
        <tr onclick="window.location.href='/admin/tiket-detail?id=${t.id}'" style="cursor:pointer">
          <td>${t.tiket_no}</td>
          <td>${t.judul}</td>
          <td>${t.area_nama || '-'}</td>
          <td>${statusBadge(t.priority)}</td>
          <td>${t.teknisi_nama || '-'}</td>
          <td>${statusBadge(t.status)}</td>
          <td style="font-size:12.5px">${jadwal}</td>
        </tr>`;
      }).join('') || '<tr><td colspan="7" class="empty-state">Belum ada tiket</td></tr>';
    }

    document.getElementById('fStatus').onchange = loadList;
    document.getElementById('fPriority').onchange = loadList;
    loadList();
  </script>
</body>
</html>
