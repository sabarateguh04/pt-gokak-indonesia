<!DOCTYPE html>
<html lang="id">
<head>
<script src="/js/theme.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leader Dashboard — CMMS Gokak</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  .layout { display: flex; height: 100vh; overflow: hidden; }
  .sidebar { width: 250px; background: var(--surface); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; }
  .sidebar a { padding: 10px 14px; color: var(--text); text-decoration: none; border-radius: 6px; margin-bottom: 4px; font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 10px; }
  .sidebar a:hover { background: var(--bg); }
  .sidebar a.active { background: var(--primary); color: white; }
  .brand { font-weight: 700; font-size: 18px; margin-bottom: 24px; display: flex; align-items: center; gap: 8px; }
  .brand small { display: block; font-size: 10px; color: var(--text-dim); text-transform: uppercase; }
  .logout { padding: 10px 14px; color: var(--danger); cursor: pointer; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 10px; margin-top: auto; }
  .main { flex: 1; padding: 30px; overflow-y: auto; background: var(--bg); }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13.5px; }
  th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--text-dim); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
  tr:hover { background: var(--surface); }
  @media (max-width: 768px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); padding: 10px; flex-direction: row; overflow-x: auto; }
    .sidebar a { margin-bottom: 0; margin-right: 4px; white-space: nowrap; }
    .main { padding: 16px; }
  }
</style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><i class="ph-fill ph-buildings" style="font-size: 24px; color: var(--primary);"></i> CMMS Gokak<small>Portal Leader</small></div>
      <div class="nav-group">
        <div class="nav-label">Overview</div>
        <a href="/leader/dashboard" class="active"><i class="ph ph-squares-four"></i> Dashboard</a>
      </div>
      <div class="nav-group">
        <div class="nav-label">Operations</div>
        <a href="/leader/tasks" class=""><i class="ph ph-ticket"></i> Tugas Line</a>
        <a href="/leader/pm-schedules" class=""><i class="ph ph-calendar-plus"></i> Jadwal PM Line</a>
      </div>
<div class="logout" id="btnLogout"><i class="ph ph-sign-out"></i> Logout</div>
    </aside>

    <main class="main">
      <div class="main-header">
        <h1>Dashboard Leader</h1>
        <div style="display:flex;align-items:center;gap:10px;">
          <button class="theme-toggle-btn" title="Ganti tema"><span class="theme-toggle-icon">🌙</span></button>
          <div class="badge badge-PRIMARY" id="userBadge">Leader</div>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px">
        <div>
          <h2 style="margin:0 0 6px 0">Daftar Tugas</h2>
          <div style="color:var(--text-dim);font-size:14px">Mengelola dan memverifikasi pekerjaan mekanik di area Anda.</div>
        </div>
        <a class="btn btn-primary btn-sm" href="/leader/task-baru"><i class="ph ph-plus" style="margin-right: 6px;"></i> Buat Tugas / Assign Mekanik</a>
      </div>

      <div class="card" style="padding:0;overflow-x:auto">
        <div class="table-responsive"><table class="table table-striped table-bordered">
          <thead>
            <tr>
              <th>Task No</th>
              <th>Judul</th>
              <th>Kategori</th>
              <th>Mesin</th>
              <th>Assigned To</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="taskList"></tbody>
        </table></div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script>
    Api.init('auth');
    const me = Api.getUser();
    document.getElementById('lblUser').textContent = `Login sbg: ${me?.nama}`;
    document.getElementById('btnLogout').onclick = () => Api.logout();

    function statusBadge(v) { return `<span class="badge badge-${v}">${v}</span>`; }

    async function loadTasks() {
      const res = await Api.get('/api/tasks');
      if (!res.success) return alert(res.message);
      
      document.getElementById('taskList').innerHTML = res.data.map(t => `
        <tr>
          <td style="font-family:monospace;color:var(--text-dim)">${t.task_no}</td>
          <td style="font-weight:500">${t.judul}</td>
          <td>${t.category_nama || '-'}</td>
          <td>${t.machine_nama || '-'}</td>
          <td>${t.assigned_to_nama || '<span style="color:var(--text-dim)">Belum ada</span>'}</td>
          <td>${statusBadge(t.status)}</td>
          <td>
            <a href="/leader/task-detail?id=${t.id}" class="btn secondary" style="padding:4px 8px;font-size:12px">Detail/Verifikasi</a>
          </td>
        </tr>
      `).join('') || `<tr><td colspan="7" class="empty-state">Belum ada tugas di line Anda.</td></tr>`;
    }

    loadTasks();
    const socket = io();
    socket.emit('register-dashboard');
    socket.on('task-update', loadTasks);
    socket.on('task-baru', loadTasks);
  </script>
</body>
</html>
