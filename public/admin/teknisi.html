<!DOCTYPE html>
<html lang="id">
<head>
<script src="/js/theme.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teknisi — PT Gokak Indonesia</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">🏭 PT Gokak Indonesia<small>Portal Admin</small></div>
      <a href="/admin/dashboard">📍 Dashboard</a>
      <a href="/admin/teknisi" class="active">🧑‍🔧 Teknisi</a>
      <a href="/admin/tiket">🎫 Tiket</a>
      <a href="/admin/kehadiran">📆 Kehadiran</a>
      <a href="/admin/area">🗺️ Area Pabrik</a>
      <div class="logout" id="btnLogout">↩ Logout</div>
    </aside>

    <main class="main">
      <div class="main-header">
        <h1>Kelola Teknisi</h1>
        <div style="display:flex;align-items:center;gap:10px">
          <button class="theme-toggle-btn" title="Ganti tema"><span class="theme-toggle-icon">🌙</span></button>
          <button id="btnNew">+ Tambah Teknisi</button>
        </div>
      </div>

      <div class="card">
        <table>
          <thead>
            <tr><th>Nama</th><th>Username</th><th>Jabatan</th><th>Area Kerja</th><th>Status</th><th>Aktif</th><th></th></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Form tambah/edit teknisi -->
  <div id="formOverlay" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50">
    <div class="card" style="width:420px;max-height:90vh;overflow:auto">
      <h3 id="formTitle" style="margin-top:0">Tambah Teknisi</h3>
      <form id="teknisiForm">
        <input type="hidden" id="f_id">
        <label>Username</label>
        <input id="f_username" required>
        <label id="labelPassword">Password</label>
        <input id="f_password" type="password">
        <label>Nama</label>
        <input id="f_nama" required>
        <label>No HP</label>
        <input id="f_no_hp">
        <label>Email</label>
        <input id="f_email" type="email">
        <label>Jabatan</label>
        <input id="f_jabatan" placeholder="cth. Teknisi Mesin">
        <label>Departemen</label>
        <input id="f_departemen" placeholder="cth. Produksi">
        <label>Area Kerja (bisa lebih dari satu)</label>
        <div id="f_areas" style="max-height:140px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px"></div>
        <div style="display:flex;gap:8px;margin-top:18px">
          <button type="submit" style="flex:1">Simpan</button>
          <button type="button" class="secondary" id="btnCancel" style="flex:1">Batal</button>
        </div>
        <div class="auth-error" id="formErr"></div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/license-banner.js"></script>
  <script>
    Api.init('admin');
    document.getElementById('btnLogout').onclick = () => Api.logout();

    const overlay = document.getElementById('formOverlay');
    const form = document.getElementById('teknisiForm');
    let allAreas = [];

    function renderAreaCheckboxes(selectedIds) {
      document.getElementById('f_areas').innerHTML = allAreas.map(a => `
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0">
          <input type="checkbox" value="${a.id}" style="width:auto" ${selectedIds.includes(a.id) ? 'checked' : ''}>
          <span style="width:10px;height:10px;border-radius:3px;background:${a.color};display:inline-block"></span>
          ${a.nama} ${a.is_primary ? '' : '<span style="color:var(--text-dim)">(referensi)</span>'}
        </label>`).join('') || '<div class="empty-state" style="padding:6px">Belum ada area -- gambar dulu di halaman Area Pabrik</div>';
    }

    async function openForm(id) {
      form.reset();
      document.getElementById('formErr').textContent = '';
      document.getElementById('f_id').value = id || '';
      document.getElementById('f_username').disabled = !!id;
      document.getElementById('formTitle').textContent = id ? 'Edit Teknisi' : 'Tambah Teknisi';
      document.getElementById('labelPassword').textContent = id ? 'Password baru (kosongkan jika tidak diubah)' : 'Password';
      document.getElementById('f_password').required = !id;
      overlay.classList.remove('hidden');

      let selectedAreaIds = [];
      if (id) {
        const res = await Api.get(`/api/teknisi/${id}`);
        if (res.success) {
          const t = res.teknisi;
          document.getElementById('formTitle').textContent = `Edit ${t.nama}`;
          document.getElementById('f_username').value = t.username;
          document.getElementById('f_nama').value = t.nama || '';
          document.getElementById('f_no_hp').value = t.no_hp || '';
          document.getElementById('f_email').value = t.email || '';
          document.getElementById('f_jabatan').value = t.jabatan || '';
          document.getElementById('f_departemen').value = t.departemen || '';
          selectedAreaIds = res.area.map(a => a.id);
        }
      }
      renderAreaCheckboxes(selectedAreaIds);
    }
    function closeForm() { overlay.classList.add('hidden'); }

    document.getElementById('btnNew').onclick = () => openForm(null);
    document.getElementById('btnCancel').onclick = closeForm;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('f_id').value;
      const body = {
        nama: document.getElementById('f_nama').value.trim(),
        no_hp: document.getElementById('f_no_hp').value.trim(),
        email: document.getElementById('f_email').value.trim(),
        jabatan: document.getElementById('f_jabatan').value.trim(),
        departemen: document.getElementById('f_departemen').value.trim(),
      };
      const password = document.getElementById('f_password').value;
      if (password) body.password = password;

      let res;
      let teknisiId = id;
      if (id) {
        res = await Api.put(`/api/teknisi/${id}`, body);
      } else {
        body.username = document.getElementById('f_username').value.trim();
        body.password = password;
        res = await Api.post('/api/teknisi', body);
        teknisiId = res.teknisiId;
      }
      if (!res.success) {
        document.getElementById('formErr').textContent = res.message || 'Gagal menyimpan';
        return;
      }

      const areaIds = [...document.querySelectorAll('#f_areas input:checked')].map(c => Number(c.value));
      await Api.post(`/api/teknisi/${teknisiId}/area`, { area_ids: areaIds });

      closeForm();
      loadList();
    });

    function statusBadge(status) { return `<span class="badge badge-${status}">${status}</span>`; }

    async function loadList() {
      const [teknisiRes, areaRes] = await Promise.all([Api.get('/api/teknisi'), Api.get('/api/area')]);
      if (!teknisiRes.success) return;
      if (areaRes.success) allAreas = areaRes.area.filter(a => a.is_active);

      document.getElementById('tbody').innerHTML = teknisiRes.teknisi.map(t => `
        <tr>
          <td>${t.nama}</td>
          <td>${t.username}</td>
          <td>${t.jabatan || '-'}</td>
          <td>${t.area_nama || '<span class="empty-state" style="padding:0">Belum di-set</span>'}</td>
          <td>${statusBadge(t.status)}</td>
          <td>${t.is_active ? 'Ya' : 'Nonaktif'}</td>
          <td><button class="secondary" onclick='openForm(${t.id})'>Edit</button></td>
        </tr>`).join('') || '<tr><td colspan="7" class="empty-state">Belum ada teknisi</td></tr>';
    }

    loadList();
  </script>
</body>
</html>
