<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dashboard Mekanik</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/mekanik.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-left">
        <div class="avatar" id="userAvatar">M</div>
        <div><div class="topbar-name" id="namaUser">Memuat...</div><div class="topbar-role">Mekanik</div></div>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="themeToggle" title="Tema">&#9790;</button>
        <button class="icon-btn danger" id="btnLogout" title="Logout">Logout</button>
      </div>
    </header>
    <div class="status-bar">
      <button class="status-pill" id="btnOnline">&#9679; Online</button>
      <button class="status-pill" id="btnOffline">&#9679; Offline</button>
    </div>
    <div class="status-hint" id="statusHint"></div>
    <div class="section-header">
      <span>Tugas Saya</span>
      <a class="btn-add" href="/mekanik/tiket-baru">+ Lapor</a>
    </div>
    <div class="task-list" id="tiketList">
      <div class="loading-state">Memuat tugas...</div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/teknisi-tracker.js"></script>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script>
    Api.init("auth");var me=Api.getUser();if(!me)window.location.href="/";
    document.getElementById("namaUser").textContent=me.nama||"";
    document.getElementById("userAvatar").textContent=(me.nama||"M").charAt(0).toUpperCase();
    document.getElementById("btnLogout").onclick=function(){TeknisiTracker.stop();Api.logout();};
    var html=document.documentElement,themeBtn=document.getElementById("themeToggle");
    function applyTheme(t){html.setAttribute("data-theme",t);themeBtn.innerHTML=t==="dark"?"&#9728;":"&#9790;";localStorage.setItem("mk_theme",t);}
    applyTheme(localStorage.getItem("mk_theme")||"light");
    themeBtn.onclick=function(){applyTheme(html.getAttribute("data-theme")==="dark"?"light":"dark");};
    var BADGE={OPEN:"Baru",IN_PROGRESS:"Proses",SELESAI:"Selesai",TERVERIFIKASI:"Verified",CANCELLED:"Batal"};
    var PRIO={HIGH:"#ef4444",MEDIUM:"#f59e0b",LOW:"#10b981"};
    function setToggleUi(status){
      document.getElementById("btnOnline").classList.toggle("active",status!=="OFFLINE");
      document.getElementById("btnOffline").classList.toggle("active",status==="OFFLINE");
      var h=document.getElementById("statusHint");
      if(status==="ONLINE"||status==="ON_TASK"){h.textContent="Online - lokasi terkirim tiap 30 detik.";h.className="status-hint green";}
      else{h.textContent="Offline - lokasi tidak terkirim.";h.className="status-hint gray";}
    }
    async function setStatus(s){var r=await Api.post("/api/users/"+me.id+"/status",{status:s});if(!r.success)return alert(r.message);setToggleUi(s);if(s==="OFFLINE")TeknisiTracker.stop();else TeknisiTracker.start(me.id);}
    document.getElementById("btnOnline").onclick=function(){setStatus("ONLINE");};
    document.getElementById("btnOffline").onclick=function(){setStatus("OFFLINE");};
    async function loadTiket(){
      var r=await Api.get("/api/tasks"),list=document.getElementById("tiketList");
      if(!r.success||!r.data||!r.data.length){list.innerHTML="<div class='empty-state'>Tidak ada tugas aktif</div>";return;}
      list.innerHTML=r.data.map(function(t){
        var c=PRIO[t.priority]||"#888",l=BADGE[t.status]||t.status;
        return "<div class='task-card' onclick=\"location.href='/mekanik/tiket-detail?id="+t.id+"'\">"
          +"<div class='task-accent' style='background:"+c+"'></div>"
          +"<div class='task-body'><div class='task-title'>"+t.judul+"</div>"
          +"<div class='task-meta'>"+t.task_no+" &middot; "+(t.machine_nama||t.line_nama||"Lokasi belum diisi")+"</div></div>"
          +"<span class='badge badge-"+t.status+"'>"+l+"</span></div>";
      }).join("");
    }
    (async function(){
      var d=await Api.get("/api/users/"+me.id);
      if(d.success){setToggleUi(d.user.status);if(d.user.status!=="OFFLINE")TeknisiTracker.start(me.id);}
      await loadTiket();
      var socket=io();socket.emit("register-teknisi",me.id);
      socket.on("task-baru",loadTiket);socket.on("task-update",loadTiket);
      setInterval(loadTiket,20000);
    })();
  </script>
</body>
</html>
