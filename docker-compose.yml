# Contoh docker-compose buat CUSTOMER (bukan buat development). MySQL
# SENGAJA GAK ikut di-containerize di sini -- customer pakai MySQL
# mereka sendiri (di server yang sama ATAU server terpisah), biar data
# & backup-nya sepenuhnya di kontrol mereka, bukan tanggung jawab kami.
#
# Cara pakai:
#   1. Salin .env.example jadi .env, isi kredensial DB customer +
#      ID_MITRA (kode unik instalasi ini, DITENTUKAN VENDOR -- harus
#      sama persis dengan --id yang dipakai vendor pas generate token
#      lisensinya, lihat licensing-tools/generate-license.js).
#   2. docker compose up -d
#      -- Skema database (11 tabel) DIBUATKAN OTOMATIS pas pertama
#         kali jalan (lihat scripts/migrate.js), gak perlu jalanin
#         schema.sql manual.
#   3. Buka dashboard admin, login pakai akun default dari schema.sql
#      (GANTI PASSWORD-nya begitu berhasil login).
#   4. Lisensi masih KOSONG di titik ini -- dashboard otomatis
#      ngarahin ke halaman "Lisensi Tidak Aktif". Tempel token yang
#      dikirim vendor di situ (atau lewat menu 🔑 Lisensi kalau
#      lisensinya masih valid tapi mau diperpanjang/ditambah seat) --
#      LANGSUNG dari dashboard, gak perlu SSH/taruh file manual ke
#      server sama sekali.
#
# Ganti port kiri (mis. "8080:3010") kalau port 3010 udah dipakai
# service lain di server -- port KANAN (3010) itu port internal
# container, JANGAN diubah (harus sama kayak PORT default aplikasi).
# Lisensi TETAP berlaku sama persis walau port luarnya diganti-ganti --
# validasi lisensinya gak nyangkut ke port sama sekali.
services:
  app:
    image: ptgokak/tracking-app:1.0.0
    ports:
      - "3010:3010"
    env_file:
      - .env
    environment:
      # Token lisensi disimpan di named volume `license_data` (BUKAN
      # bind-mount read-only) -- soalnya sekarang admin nempel/ganti
      # token dari DASHBOARD (menu Lisensi / halaman lock), yang
      # nulis file-nya langsung dari DALAM container. File-nya tetap
      # PERSISTEN lintas restart/update container karena named volume,
      # bukan lapisan container yang ephemeral.
      - LICENSE_FILE=/app/license-data/license.lic
    extra_hosts:
      # Biar DB_HOST=host.docker.internal jalan juga di Linux (default-nya
      # cuma jalan otomatis di Docker Desktop/Windows/Mac).
      - "host.docker.internal:host-gateway"
    volumes:
      - license_data:/app/license-data
      - uploads_data:/app/uploads/bukti
    restart: unless-stopped

volumes:
  uploads_data:
  license_data:
