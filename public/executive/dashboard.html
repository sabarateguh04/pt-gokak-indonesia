<!DOCTYPE html>
<html lang="id">
<head>
<script src="/js/theme.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Executive Dashboard — CMMS Gokak</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  .layout { padding: 30px; max-width: 1200px; margin: 0 auto; }
  .grid-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .kpi-card { padding: 20px; background: var(--surface); border-radius: 8px; border: 1px solid var(--border); text-align: center; }
  .kpi-value { font-size: 32px; font-weight: 700; margin: 10px 0; color: var(--text); }
  .kpi-label { font-size: 13px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
  .chart-container { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 24px; }
</style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><i class="ph-fill ph-buildings" style="font-size: 24px; color: var(--primary);"></i> CMMS Gokak<small>Portal Executive</small></div>
      <div class="nav-group">
        <div class="nav-label">Overview</div>
        <a href="/executive/dashboard" class="active"><i class="ph ph-squares-four"></i> Dashboard</a>
      </div>
<div class="logout" id="btnLogout"><i class="ph ph-sign-out"></i> Logout</div>
    </aside>

    <main class="main">
      <div class="main-header">
        <h1>Executive Dashboard</h1>
        <div style="display:flex;align-items:center;gap:10px;">
          <button class="theme-toggle-btn" title="Ganti tema"><span class="theme-toggle-icon">🌙</span></button>
          <div class="badge badge-PRIMARY" id="userBadge">Executive</div>
        </div>
      </div>

    <h3>KPI Pekerjaan (Tiket)</h3>
    <div class="grid-kpi" id="kpiTasks">
      <div class="kpi-card"><div class="kpi-label">Memuat...</div></div>
    </div>

    <h3>KPI Mekanik & Pegawai</h3>
    <div class="grid-kpi" id="kpiPegawai">
      <div class="kpi-card"><div class="kpi-label">Memuat...</div></div>
    </div>

    <div style="display:flex; gap: 20px; flex-wrap: wrap;">
      <div class="chart-container" style="flex:1; min-width:300px;">
        <h3 style="margin-top:0">Performa Mekanik Terbaik</h3>
        <div class="table-responsive"><table class="table table-striped table-bordered">
          <thead>
            <tr style="border-bottom:1px solid var(--border)">
              <th style="padding:8px 0">Nama</th>
              <th>Tugas Selesai</th>
              <th>Avg Durasi</th>
            </tr>
          </thead>
          <tbody id="tblPerformance"></tbody>
        </table></div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    Api.init('auth');
    const me = Api.getUser();
    document.getElementById('lblUser').textContent = me ? me.nama : '';
    document.getElementById('btnLogout').onclick = () => Api.logout();

    async function loadData() {
      const [kpi, analytics] = await Promise.all([
        Api.get('/api/dashboard/kpi'),
        Api.get('/api/dashboard/analytics')
      ]);

      if (kpi.success) {
        document.getElementById('kpiTasks').innerHTML = `
          <div class="kpi-card"><div class="kpi-label">Total Tiket</div><div class="kpi-value">${kpi.tiket_kpi.total_tiket}</div></div>
          <div class="kpi-card" style="border-bottom: 3px solid var(--warn)"><div class="kpi-label">Baru / Terbuka</div><div class="kpi-value">${kpi.tiket_kpi.baru}</div></div>
          <div class="kpi-card" style="border-bottom: 3px solid var(--primary)"><div class="kpi-label">Sedang Dikerjakan</div><div class="kpi-value">${kpi.tiket_kpi.progress}</div></div>
          <div class="kpi-card" style="border-bottom: 3px solid var(--success)"><div class="kpi-label">Telah Diverifikasi</div><div class="kpi-value">${kpi.tiket_kpi.terverifikasi || 0}</div></div>
        `;
        document.getElementById('kpiPegawai').innerHTML = `
          <div class="kpi-card"><div class="kpi-label">Total Mekanik</div><div class="kpi-value">${kpi.teknisi_kpi.total_teknisi}</div></div>
          <div class="kpi-card" style="border-bottom: 3px solid var(--success)"><div class="kpi-label">Sedang Online</div><div class="kpi-value">${kpi.teknisi_kpi.online}</div></div>
          <div class="kpi-card" style="border-bottom: 3px solid var(--primary)"><div class="kpi-label">Bertugas (On Task)</div><div class="kpi-value">${kpi.teknisi_kpi.on_task}</div></div>
        `;
      }

      if (analytics.success) {
        document.getElementById('tblPerformance').innerHTML = analytics.teknisi_performance.map(p => `
          <tr style="border-bottom:1px solid var(--surface)">
            <td style="padding:10px 0">${p.nama}</td>
            <td style="font-weight:600">${p.total_selesai} <span style="font-weight:400;color:var(--text-dim)">/ ${p.total_tiket}</span></td>
            <td>${p.avg_durasi_menit ? p.avg_durasi_menit + ' menit' : '-'}</td>
          </tr>
        `).join('');
      }
    }

    loadData();
    setInterval(loadData, 30000);
  </script>
</body>
</html>
