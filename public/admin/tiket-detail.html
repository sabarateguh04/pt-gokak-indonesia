<!DOCTYPE html>
<html lang="id">
<head>
<script src="/js/theme.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Tiket — PT Gokak Indonesia</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">🏭 PT Gokak Indonesia<small>Portal Admin</small></div>
      <a href="/admin/dashboard">📍 Dashboard</a>
      <a href="/admin/teknisi">🧑‍🔧 Teknisi</a>
      <a href="/admin/tiket" class="active">🎫 Tiket</a>
      <a href="/admin/kehadiran">📆 Kehadiran</a>
      <a href="/admin/area">🗺️ Area Pabrik</a>
      <div class="logout" id="btnLogout">↩ Logout</div>
    </aside>

    <main class="main">
      <div class="main-header">
        <div>
          <h1 id="pageTitle" style="margin-bottom:2px">Buat Tiket Baru</h1>
          <div id="createdByInfo" style="color:var(--text-dim);font-size:12.5px"></div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <button class="theme-toggle-btn" title="Ganti tema"><span class="theme-toggle-icon">🌙</span></button>
          <span class="badge" id="statusBadge" style="display:none"></span>
        </div>
      </div>

      <div class="grid grid-2col">
        <div class="card">
          <h3 style="margin-top:0">Detail Tugas</h3>
          <form id="tiketForm">
            <label>Judul</label>
            <input id="f_judul" required>
            <label>Deskripsi</label>
            <textarea id="f_deskripsi"></textarea>
            <div style="display:flex;gap:10px">
              <div style="flex:1"><label>Kategori</label>
                <select id="f_kategori">
                  <option value="PERBAIKAN">Perbaikan</option>
                  <option value="MAINTENANCE">Maintenance</option>
                  <option value="INSPEKSI">Inspeksi</option>
                  <option value="LAINNYA">Lainnya</option>
                </select>
              </div>
              <div style="flex:1"><label>Priority</label>
                <select id="f_priority">
                  <option value="LOW">Low</option>
                  <option value="MEDIUM" selected>Medium</option>
                  <option value="HIGH">High</option>
                </select>
              </div>
            </div>
            <label>Area / Lokasi Kerja</label>
            <select id="f_area_id"><option value="">-- Pilih area --</option></select>
            <div style="display:flex;gap:10px">
              <div style="flex:1"><label>Tanggal Mulai</label><input id="f_tanggal_mulai" type="date"></div>
              <div style="flex:1"><label>Tanggal Selesai</label><input id="f_tanggal_selesai" type="date"></div>
            </div>
            <button type="submit" style="width:100%;margin-top:18px" id="btnSubmit">Buat Tiket</button>
            <div class="auth-error" id="formErr"></div>
          </form>
        </div>

        <div class="card" id="assignCard" style="display:none">
          <h3 style="margin-top:0">Assign Teknisi</h3>
          <p style="color:var(--text-dim);font-size:12.5px;margin-top:-6px">Pilihan area di kiri otomatis ngikutin area kerja teknisi yang dicentang di sini.</p>
          <div id="teknisiCheckbox" style="margin-bottom:10px"></div>
          <button id="btnAssign" class="secondary" style="width:100%">Assign Teknisi Terpilih</button>
          <hr style="border-color:var(--border);margin:16px 0">
          <div id="assignedList"></div>
        </div>
      </div>

      <div class="grid grid-2col" id="lowerGrid" style="margin-top:16px;display:none">
        <div class="card">
          <h3 style="margin-top:0">Timeline</h3>
          <div id="timelineList"></div>
        </div>
        <div class="card">
          <h3 style="margin-top:0">Foto Bukti</h3>
          <div id="filesList" style="margin-bottom:10px"></div>
          <input type="file" id="fileInput" multiple accept="image/*,.pdf">
          <button id="btnUpload" class="secondary" style="margin-top:8px;width:100%">Upload Foto</button>
        </div>
      </div>

      <div style="margin-top:16px" id="cancelWrap"></div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/license-banner.js"></script>
  <script>
    Api.init('admin');
    document.getElementById('btnLogout').onclick = () => Api.logout();

    const tiketId = new URLSearchParams(window.location.search).get('id');
    const isEdit = !!tiketId;
    let allAreas = [];

    function statusBadge(v) { return `<span class="badge badge-${v}">${v}</span>`; }

    async function loadAllAreas() {
      const res = await Api.get('/api/area');
      if (res.success) allAreas = res.area.filter(a => a.is_active);
    }

    /* Dropdown area ngikutin area kerja teknisi yang dicentang (union,
       kalau lebih dari 1) -- kalau belum ada yang dicentang, tampilin
       semua area aktif (admin belum nentuin teknisinya, jadi belum ada
       konteks buat dipersempit). */
    async function updateAreaOptions(desiredValue) {
      const select = document.getElementById('f_area_id');
      if (desiredValue === undefined) desiredValue = select.value;
      const checkedIds = [...document.querySelectorAll('#teknisiCheckbox input:checked')].map(c => Number(c.value));

      let options = allAreas;
      if (checkedIds.length) {
        const results = await Promise.all(checkedIds.map(id => Api.get(`/api/teknisi/${id}`)));
        const unionMap = new Map();
        results.forEach(r => { if (r.success) r.area.forEach(a => unionMap.set(a.id, a)); });
        if (unionMap.size) options = [...unionMap.values()];
      }

      select.innerHTML = '<option value="">-- Pilih area --</option>' + options.map(a => `
        <option value="${a.id}">${a.nama}${a.is_primary ? '' : ' (referensi)'}</option>`).join('');
      if (desiredValue && options.some(a => String(a.id) === String(desiredValue))) select.value = desiredValue;
    }

    async function loadTeknisiCheckbox(assignedIds = []) {
      const res = await Api.get('/api/teknisi');
      if (!res.success) return;
      document.getElementById('teknisiCheckbox').innerHTML = res.teknisi.map(t => `
        <label style="display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0">
          <input type="checkbox" value="${t.id}" style="width:auto" ${assignedIds.includes(t.id) ? 'disabled checked' : ''}>
          ${t.nama} ${statusBadge(t.status)}
        </label>`).join('');
      document.getElementById('teknisiCheckbox').onchange = () => updateAreaOptions();
    }

    function renderAssigned(list) {
      document.getElementById('assignedList').innerHTML = list.map(t => `
        <div class="tiket-item" style="display:flex;justify-content:space-between;align-items:center">
          <div>${t.nama} ${statusBadge(t.status)}</div>
          <button class="secondary" style="padding:4px 8px" onclick="unassign(${t.id})">Lepas</button>
        </div>`).join('') || '<div class="empty-state">Belum ada teknisi di-assign</div>';
    }

    function renderTimeline(list) {
      document.getElementById('timelineList').innerHTML = list.map(t => `
        <div class="timeline-item">
          <div>[${t.actor_type}] ${t.note || t.event_type}</div>
          <div class="ts">${new Date(t.created_at).toLocaleString('id-ID')}</div>
        </div>`).join('') || '<div class="empty-state">Belum ada aktivitas</div>';
    }

    function renderFiles(list) {
      document.getElementById('filesList').innerHTML = list.map(f => `
        <a href="${f.file_url}" target="_blank" style="display:block;font-size:13px;margin:4px 0">📎 ${f.judul || f.file_url.split('/').pop()}</a>
      `).join('') || '<div class="empty-state">Belum ada foto bukti</div>';
    }

    async function loadDetail() {
      const res = await Api.get(`/api/tiket/${tiketId}`);
      if (!res.success) { document.getElementById('formErr').textContent = res.message; return; }
      const t = res.tiket;
      document.getElementById('pageTitle').textContent = t.tiket_no;
      document.getElementById('createdByInfo').textContent =
        `Dibuat oleh ${t.created_by_nama || '-'} (${t.created_by_type === 'TEKNISI' ? 'Teknisi -- self-service' : 'Admin'})`;
      const badge = document.getElementById('statusBadge');
      badge.style.display = 'inline-block';
      badge.className = `badge badge-${t.status}`;
      badge.textContent = t.status;

      document.getElementById('f_judul').value = t.judul;
      document.getElementById('f_deskripsi').value = t.deskripsi || '';
      document.getElementById('f_kategori').value = t.kategori;
      document.getElementById('f_priority').value = t.priority;
      document.getElementById('f_tanggal_mulai').value = t.tanggal_mulai || '';
      document.getElementById('f_tanggal_selesai').value = t.tanggal_selesai || '';

      const locked = ['DONE', 'CANCELLED'].includes(t.status);
      document.getElementById('btnSubmit').textContent = 'Simpan Perubahan';
      document.getElementById('btnSubmit').disabled = locked;
      document.getElementById('f_area_id').disabled = locked;
      document.getElementById('f_tanggal_mulai').disabled = locked;
      document.getElementById('f_tanggal_selesai').disabled = locked;

      document.getElementById('assignCard').style.display = 'block';
      document.getElementById('lowerGrid').style.display = 'grid';
      await loadTeknisiCheckbox(t.teknisi_assigned.map(k => k.id));
      await updateAreaOptions(t.area_id);
      renderAssigned(t.teknisi_assigned);
      renderTimeline(t.timeline);
      renderFiles(t.files);

      if (!locked) {
        document.getElementById('cancelWrap').innerHTML = `<button class="danger" id="btnCancelTiket">Batalkan Tiket</button>`;
        document.getElementById('btnCancelTiket').onclick = async () => {
          if (!confirm('Batalkan tiket ini?')) return;
          await Api.post(`/api/tiket/${tiketId}/status`, { status: 'CANCELLED' });
          loadDetail();
        };
      } else {
        document.getElementById('cancelWrap').innerHTML = '';
      }
    }

    window.unassign = async (teknisiId) => {
      if (!confirm('Lepas teknisi ini dari tiket?')) return;
      await Api.del(`/api/tiket/${tiketId}/assign/${teknisiId}`);
      loadDetail();
    };

    document.getElementById('tiketForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        judul: document.getElementById('f_judul').value.trim(),
        deskripsi: document.getElementById('f_deskripsi').value.trim(),
        kategori: document.getElementById('f_kategori').value,
        priority: document.getElementById('f_priority').value,
        area_id: document.getElementById('f_area_id').value || null,
        tanggal_mulai: document.getElementById('f_tanggal_mulai').value || null,
        tanggal_selesai: document.getElementById('f_tanggal_selesai').value || null,
      };
      const errBox = document.getElementById('formErr');
      errBox.textContent = '';

      if (isEdit) {
        const res = await Api.put(`/api/tiket/${tiketId}`, body);
        if (!res.success) { errBox.textContent = res.message; return; }
        loadDetail();
      } else {
        const checked = [...document.querySelectorAll('#teknisiCheckbox input:checked')].map(c => Number(c.value));
        body.teknisi_ids = checked;
        const res = await Api.post('/api/tiket', body);
        if (!res.success) { errBox.textContent = res.message; return; }
        window.location.href = `/admin/tiket-detail?id=${res.tiketId}`;
      }
    });

    document.getElementById('btnAssign').addEventListener('click', async () => {
      const checked = [...document.querySelectorAll('#teknisiCheckbox input:checked:not(:disabled)')].map(c => Number(c.value));
      if (!checked.length) return;
      await Api.post(`/api/tiket/${tiketId}/assign`, { teknisi_ids: checked });
      loadDetail();
    });

    document.getElementById('btnUpload').addEventListener('click', async () => {
      const input = document.getElementById('fileInput');
      if (!input.files.length) return;
      const fd = new FormData();
      [...input.files].forEach(f => fd.append('files', f));
      const res = await Api.upload(`/api/tiket/${tiketId}/files`, fd);
      if (res.success) { input.value = ''; loadDetail(); }
    });

    (async () => {
      await loadAllAreas();
      if (isEdit) {
        loadDetail();
      } else {
        document.getElementById('assignCard').style.display = 'block';
        await loadTeknisiCheckbox([]);
        await updateAreaOptions();
      }
    })();
  </script>
</body>
</html>
