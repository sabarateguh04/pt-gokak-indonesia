<!DOCTYPE html>
<html lang="id">
<head>
<script src="/js/theme.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buat Tugas — Monitoring App</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="teknisi-shell">
    <div class="teknisi-topbar">
      <a href="/teknisi/home" style="color:var(--text-dim)">← Kembali</a>
      <button class="theme-toggle-btn" title="Ganti tema"><span class="theme-toggle-icon">🌙</span></button>
    </div>

    <div class="card">
      <h3 style="margin-top:0">Buat Tugas Baru</h3>
      <p style="color:var(--text-dim);font-size:12.5px;margin-top:-6px">Tugas yang Anda buat sendiri langsung ke-assign ke Anda.</p>
      <form id="tiketForm">
        <label>Judul</label>
        <input id="f_judul" required placeholder="cth. Perbaikan panel listrik">
        <label>Deskripsi</label>
        <textarea id="f_deskripsi"></textarea>
        <div style="display:flex;gap:10px">
          <div style="flex:1"><label>Kategori</label>
            <select id="f_kategori">
              <option value="PERBAIKAN">Perbaikan</option>
              <option value="MAINTENANCE">Maintenance</option>
              <option value="INSPEKSI">Inspeksi</option>
              <option value="LAINNYA">Lainnya</option>
            </select>
          </div>
          <div style="flex:1"><label>Priority</label>
            <select id="f_priority">
              <option value="LOW">Low</option>
              <option value="MEDIUM" selected>Medium</option>
              <option value="HIGH">High</option>
            </select>
          </div>
        </div>
        <label>Area / Lokasi Kerja</label>
        <select id="f_area_id"><option value="">-- Pilih area --</option></select>
        <div id="noAreaHint" class="empty-state hidden" style="padding:8px 0">
          Belum ada area kerja yang di-set admin untuk Anda -- hubungi admin dulu di menu Teknisi.
        </div>
        <div style="display:flex;gap:10px">
          <div style="flex:1"><label>Tanggal Mulai</label><input id="f_tanggal_mulai" type="date"></div>
          <div style="flex:1"><label>Tanggal Selesai</label><input id="f_tanggal_selesai" type="date"></div>
        </div>
        <button type="submit" style="width:100%;margin-top:18px">Buat &amp; Assign ke Saya</button>
        <div class="auth-error" id="formErr"></div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    Api.init('teknisi');
    const me = Api.getUser();

    (async () => {
      const res = await Api.get(`/api/teknisi/${me.id}`);
      if (!res.success) return;
      const areas = res.area || [];
      if (!areas.length) {
        document.getElementById('noAreaHint').classList.remove('hidden');
        document.getElementById('f_area_id').disabled = true;
        return;
      }
      document.getElementById('f_area_id').innerHTML = '<option value="">-- Pilih area --</option>' +
        areas.map(a => `<option value="${a.id}">${a.nama}${a.is_primary ? '' : ' (referensi)'}</option>`).join('');
    })();

    document.getElementById('tiketForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        judul: document.getElementById('f_judul').value.trim(),
        deskripsi: document.getElementById('f_deskripsi').value.trim(),
        kategori: document.getElementById('f_kategori').value,
        priority: document.getElementById('f_priority').value,
        area_id: document.getElementById('f_area_id').value || null,
        tanggal_mulai: document.getElementById('f_tanggal_mulai').value || null,
        tanggal_selesai: document.getElementById('f_tanggal_selesai').value || null,
      };
      const res = await Api.post('/api/tiket', body);
      const errBox = document.getElementById('formErr');
      if (!res.success) { errBox.textContent = res.message || 'Gagal membuat tugas'; return; }
      window.location.href = `/teknisi/tiket-detail?id=${res.tiketId}`;
    });
  </script>
</body>
</html>
