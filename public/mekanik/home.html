<!DOCTYPE html>
<html lang="id">
<head>
<script src="/js/theme.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Mekanik — CMMS Gokak</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <div class="teknisi-shell">
    <div class="teknisi-topbar">
      <div>
        <div style="font-weight:700" id="namaUser"></div>
        <div style="color:var(--text-dim);font-size:12px">Dashboard Mekanik</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <button class="theme-toggle-btn" title="Ganti tema"><span class="theme-toggle-icon">🌙</span></button>
        <span class="logout" id="btnLogout" style="color:var(--danger);font-size:13px;cursor:pointer;">Logout</span>
      </div>
    </div>

    <div class="status-toggle">
      <button id="btnOnline"><i class="ph-fill ph-check-circle"></i> Online</button>
      <button id="btnOffline"><i class="ph-fill ph-minus-circle"></i> Offline</button>
    </div>
    <div class="empty-state" id="statusHint" style="padding:6px 0"></div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <h3 style="margin:0">Tugas Saya</h3>
        <a class="btn btn-primary btn-sm" href="/mekanik/tiket-baru" style="padding:8px 14px;font-size:13px"><i class="ph ph-plus" style="margin-right: 6px;"></i> Lapor Masalah</a>
      </div>
      <div id="tiketList"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/teknisi-tracker.js"></script>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script>
    Api.init('auth');
    const me = Api.getUser();
    document.getElementById('namaUser').textContent = me?.nama || '';
    document.getElementById('btnLogout').onclick = () => { TeknisiTracker.stop(); Api.logout(); };

    function statusBadge(v) { return `<span class="badge badge-${v}">${v}</span>`; }

    function setToggleUi(status) {
      document.getElementById('btnOnline').classList.toggle('active', status !== 'OFFLINE');
      document.getElementById('btnOffline').classList.toggle('active', status === 'OFFLINE');
      const hint = status === 'ON_TASK'
        ? 'Anda sedang bertugas — lokasi terus terkirim.'
        : status === 'ONLINE'
          ? 'Anda online — lokasi terkirim tiap 30 detik.'
          : 'Anda offline — lokasi tidak terkirim.';
      document.getElementById('statusHint').textContent = hint;
    }

    async function setStatus(status) {
      const res = await Api.post(`/api/users/${me.id}/status`, { status });
      if (!res.success) return alert(res.message);
      setToggleUi(status);
      if (status === 'OFFLINE') TeknisiTracker.stop();
      else TeknisiTracker.start(me.id);
    }

    document.getElementById('btnOnline').onclick = () => setStatus('ONLINE');
    document.getElementById('btnOffline').onclick = () => setStatus('OFFLINE');

    async function loadTiket() {
      const res = await Api.get('/api/tasks'); // Endpoint tasks automatically filters by me.id if role is MEKANIK
      if (!res.success) return;
      document.getElementById('tiketList').innerHTML = res.data.map(t => `
        <div class="tiket-item" onclick="window.location.href='/mekanik/tiket-detail?id=${t.id}'" style="cursor:pointer">
          <div class="judul">${t.judul} ${statusBadge(t.status)}</div>
          <div class="meta">${t.task_no} · ${t.machine_nama || t.line_nama || 'Lokasi belum diisi'}</div>
        </div>`).join('') || '<div class="empty-state">Belum ada tugas untuk Anda</div>';
    }

    (async () => {
      const detail = await Api.get(`/api/users/${me.id}`);
      if (detail.success) {
        setToggleUi(detail.user.status);
        if (detail.user.status !== 'OFFLINE') TeknisiTracker.start(me.id);
      }
      await loadTiket();

      const socket = io();
      socket.emit('register-teknisi', me.id);
      socket.on('task-baru', loadTiket);
      socket.on('task-update', loadTiket);
      setInterval(loadTiket, 20000);
    })();
  </script>
</body>
</html>
